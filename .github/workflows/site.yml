name: site

# Rebuilds and redeploys the dashboard as soon as its code changes (the hourly collect run only
# redeploys when new data lands). No data is collected here. Zero LLM tokens.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'collector/aggregate.py'
      - 'collector/rollup.py'
      - 'collector/nrtext.py'
      - 'config/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build dashboard summaries
        run: python collector/aggregate.py --data data --out docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
